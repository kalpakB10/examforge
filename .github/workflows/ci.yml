name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ─── Job 1: TypeScript compile check across every service ──────────────────
  typecheck:
    name: typecheck (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, question-bank, exam-generator, exam-session, result-engine, dispute-manager]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcq-exam-system/services/${{ matrix.service }}/package-lock.json
      - name: Install deps
        working-directory: mcq-exam-system/services/${{ matrix.service }}
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        working-directory: mcq-exam-system/services/${{ matrix.service }}
        run: npx prisma generate
      - name: tsc --noEmit
        working-directory: mcq-exam-system/services/${{ matrix.service }}
        run: npx tsc --noEmit

  # ─── Job 2: Unit tests for question-bank (fast, no infra) ──────────────────
  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcq-exam-system/services/question-bank/package-lock.json
      - name: Install deps
        working-directory: mcq-exam-system/services/question-bank
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        working-directory: mcq-exam-system/services/question-bank
        run: npx prisma generate
      - name: Run unit tests
        working-directory: mcq-exam-system/services/question-bank
        run: npm test

  # ─── Job 3: Full stack + integration + E2E ─────────────────────────────────
  integration-and-e2e:
    name: integration + E2E
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build + start stack
        working-directory: mcq-exam-system
        run: |
          docker compose build
          docker compose up -d

      - name: Wait for gateway
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ready >/dev/null; then
              echo "gateway ready after ${i}0s"
              exit 0
            fi
            sleep 2
          done
          echo "gateway did not come up" >&2
          docker compose -f mcq-exam-system/docker-compose.yml logs --tail=100
          exit 1

      - name: Seed E2E teacher account
        run: |
          curl -sf -X POST http://localhost:3000/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"teacher@test.com","password":"password123","name":"CI Teacher","role":"TEACHER"}' \
            || echo "(teacher may already exist, continuing)"

      - name: Install test deps
        working-directory: mcq-exam-system/tests
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: mcq-exam-system/tests
        run: npx playwright install --with-deps chromium

      - name: Run full test suite
        working-directory: mcq-exam-system
        run: bash scripts/test.sh

      - name: Dump container logs on failure
        if: failure()
        working-directory: mcq-exam-system
        run: docker compose logs --tail=200

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: mcq-exam-system/tests/playwright-report/
          retention-days: 7
