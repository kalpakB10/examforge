# Production overlay for docker-compose.
#
# Usage:
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What it changes vs. the base compose file:
#   - NODE_ENV=production so services fail-fast on insecure default secrets
#   - restart: unless-stopped on every service (auto-recovers from crashes)
#   - Resource limits (memory + cpu) so one runaway process can't starve the box
#   - Postgres port NOT exposed to the host — connect via `docker exec` only
#   - Redis port NOT exposed to the host either
#
# You MUST provide `.env.prod` with real secrets (see .env.example for keys).
# The base compose file uses `${VAR:-default}` for secrets, so the prod overlay
# does not need to redeclare them — just make sure .env.prod is loaded.

services:
  postgres:
    ports: []              # remove host port binding
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  redis:
    ports: []              # remove host port binding
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  migrator:
    # One-shot; don't restart on completion. Base already has restart: "no".
    restart: "no"

  api-gateway:
    environment:
      NODE_ENV: production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.75"

  question-bank:
    environment:
      NODE_ENV: production
    restart: unless-stopped
    deploy:
      resources:
        # Puppeteer + chromium — needs more headroom.
        limits:
          memory: 1G
          cpus: "1.5"

  exam-generator:
    environment:
      NODE_ENV: production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  exam-session:
    environment:
      NODE_ENV: production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.75"

  result-engine:
    environment:
      NODE_ENV: production
    restart: unless-stopped
    deploy:
      resources:
        # Puppeteer + chromium — needs more headroom.
        limits:
          memory: 1G
          cpus: "1.5"

  dispute-manager:
    environment:
      NODE_ENV: production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  frontend:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
